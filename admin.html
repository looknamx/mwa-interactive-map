<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ระบบจัดการแผนที่ | การประปานครหลวง</title><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="pin.css">
</head>
<body>
  <section id="pin-gate" class="pin-gate">
    <form id="pin-form" class="pin-card">
      <div class="pin-mark">กปน.</div><small>สำหรับผู้ดูแลระบบ</small><h2>กรอกรหัส PIN</h2>
      <p>ใส่รหัสตัวเลข 4 หลักเพื่อแก้ไขข้อมูลแผนที่</p>
      <input id="pin-input" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="one-time-code" aria-label="รหัส PIN 4 หลัก" required autofocus>
      <button type="submit">เข้าสู่ระบบ</button><span id="pin-error" aria-live="polite"></span>
    </form>
  </section>
  <header class="admin-header"><div><small>การประปานครหลวง</small><h1>ระบบจัดการแผนที่</h1></div><div class="header-actions"><a href="index.html">ดูหน้า iframe</a><button id="admin-logout" type="button">ออกจากระบบ</button><button id="export-data" type="button">ส่งออก JSON</button><label class="import-button">นำเข้า JSON<input id="import-data" type="file" accept="application/json"></label></div></header>
  <main class="admin-layout">
    <aside class="admin-panel"><div class="panel-title"><div><h2 id="form-title">เพิ่ม Label ใหม่</h2><p>คลิกบนแผนที่เพื่อเลือกตำแหน่ง</p></div><button id="new-label" type="button">+ ใหม่</button></div>
      <form id="label-form"><input id="edit-index" type="hidden"><label>ID <input id="field-id" required placeholder="เช่น chemical-building"></label><label>ข้อความบน Label <input id="field-label" required placeholder="CHEMICAL BUILDING"></label><label>ชื่อสถานที่ <input id="field-name" required placeholder="อาคารสารเคมี"></label><div class="form-row"><label>x (%) <input id="field-x" type="number" min="0" max="100" step="0.01" required></label><label>y (%) <input id="field-y" type="number" min="0" max="100" step="0.01" required></label></div><label>ประเภท <select id="field-category" required><option value="production">ระบบผลิตน้ำ</option><option value="transmission">ระบบส่งน้ำ</option><option value="civil">งานโยธา</option><option value="support">อาคารสนับสนุน</option></select></label><label>รายละเอียด <textarea id="field-description" rows="4" required></textarea></label><label>ชื่อเอกสาร <input id="field-download-label" placeholder="ข้อมูลสถานที่ (PDF)"></label><label>URL เอกสาร <input id="field-download-url" placeholder="documents/example.pdf"></label><label class="check-row"><input id="field-sample" type="checkbox" checked> ระบุว่าเป็นไฟล์ตัวอย่าง</label><div class="form-actions"><button class="save-button" type="submit">บันทึก Label</button><button id="delete-label" class="delete-button" type="button" hidden>ลบ</button></div></form><p id="admin-status" class="admin-status" aria-live="polite"></p>
    </aside>
    <section class="workspace"><div class="preview-head"><div><strong>ตัวอย่างแผนที่</strong><span>คลิกบนภาพเพื่อกรอกค่า x, y</span></div><button id="reset-data" type="button">คืนค่าข้อมูลเริ่มต้น</button></div><iframe id="map-preview" src="map.html?admin=1" title="ตัวอย่างแผนที่สำหรับกำหนดตำแหน่ง"></iframe><div class="list-head"><h2>Label ทั้งหมด</h2><span id="label-count"></span></div><div id="label-list" class="label-list"></div></section>
  </main>
  <script src="admin-auth.js"></script><script src="map-data.js"></script><script src="admin.js"></script>
</body></html>
